<script>
const letters=[
{name:'いそやん',fav:'',msg:`ミブへ、\n\nHAPPY BIRTHDAY\n\nおめでとう。ミブと出会って2回目の誕生日祝える事ほんと嬉しいです。Tiktokで出会って約2年、アイドルになって約1年と8ヶ月という月日がたちます。こんなにも長く応援してるとは自分でもビックリしてるw\n\nきっかけは、まあ単純やったね。誕生日がBzのデビュー日と同じってだけで最初は軽い気持ちで応援してたけど、ステージで輝いてる姿を見て、その笑顔に歌声にパフォーマンスにどんどん魅了されていき、いつの間にかLIVE行けば常に全力で応援するようになったねw\n\nほんと、ステージに立ってるミブ、素敵です。いつも元気を貰うしほんと感謝でしかないね。ミブを通じて、こんなにもたくさんの仲間ができるとはねw 今ではその仲間と楽しい時間が過ごせてめっちゃ幸せだなぁ。ほんとありがとう。\n\nTiktokで出会ってくれてARIGATO、アイドルになってくれてARIGATO、アイドルを続けてくれてARIGATO。これからも変わらずずっと応援して行きます。俺にとっての推しはミブただ1人なんでね。ミブの全てがほんま大好きです。\n\n改めて誕生日おめでとう 自分もミブにもっと感動してもらえるようなフロアを作って行こうと思ってます。一緒に頑張っていこうね‼\n\nPS. あまり無茶、無理はしないでねw 頑張ることはいいことなんやけど、休める時はしっかり休んでください。お願いします。`},

function cleanText(s){return(s||'').normalize('NFC').replace(/[\u200B-\u200D\uFEFF]/g,'').replace(/^[\s　]*(?:[・･●○■□◆◇▶▷]|[0-9０-９]+[\.．、)]|[①-⑳])[\s　]*/gm,'').replace(/\n{3,}/g,'\n\n').trim()}
letters.forEach(l=>{l.msg=cleanText(l.msg);l.fav=cleanText(l.fav)});
let current=0,timer=null;
function showPage(id){clearTimeout(timer);document.querySelectorAll('.page').forEach(x=>x.classList.remove('active','turn-in'));document.getElementById(id).classList.add('active','turn-in');scrollTo(0,0)}
function showToc(){buildToc();showPage('toc')}
function buildToc(){const x=document.getElementById('tocList');x.innerHTML='';letters.forEach((l,i)=>{let b=document.createElement('button');b.className='tocItem';b.innerHTML=`<span class="tocNo">${String(i+1).padStart(2,'0')}</span><span class="tocName">${l.name}</span><span>${i%2?'🐈‍⬛':'☆'}</span>`;b.onclick=()=>openLetter(i);x.appendChild(b)});let b=document.createElement('button');b.className='tocItem';b.innerHTML='<span class="tocNo">☆</span><span class="tocName">うみう・特別な手紙</span><span>🐈‍⬛</span>';b.onclick=()=>showPage('special');x.appendChild(b)}
function openLetter(i){current=i;let l=letters[i],sheet=document.getElementById('letterSheet');sheet.classList.toggle('long',l.msg.length>350);sheet.classList.toggle('long-name',l.name.length>16);document.getElementById('letterNo').textContent=`LETTER ${String(i+1).padStart(2,'0')}　☆`;document.getElementById('sender').textContent=l.name;document.getElementById('signature').textContent=`― ${l.name}より　☆`;document.getElementById('favoriteText').textContent=l.fav;document.getElementById('favorite').style.display=l.fav?'block':'none';document.getElementById('count').textContent=`🐈‍⬛　${i+1} / ${letters.length}　☆`;showPage('letterPage');typeMessage(l)}
function typeMessage(l){let el=document.getElementById('message'),sig=document.getElementById('signature'),fav=document.getElementById('favorite');el.textContent='';sig.classList.remove('show');fav.classList.remove('show');let text=l.msg||'（ミブの好きなところを届けてくれました ☆）',i=0,c=document.createElement('span');c.className='cursor';el.appendChild(c);function type(){if(i<text.length){let ch=text[i++];if(ch==='\n')c.before(document.createElement('br'));else c.before(document.createTextNode(ch));timer=setTimeout(type,text.length>350?18:45)}else{c.remove();sig.classList.add('show');if(l.fav)fav.classList.add('show')}}setTimeout(type,500)}
function nextLetter(){current<letters.length-1?openLetter(current+1):showPage('special')}
buildToc();
