<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>MIBU BIRTHDAY MESSAGE BOOK 2026</title>
<style>
:root{--gold:#e2c67d}*{box-sizing:border-box}html,body{margin:0;background:#08060b;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif}.page{display:none;min-height:100dvh;padding:28px 18px 42px;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 35%,#301441,#100915 58%,#050407 100%);perspective:1600px}.page.active{display:flex}.sheet{width:min(100%,520px);transform-origin:left center}.turn-in .sheet{animation:turnIn .72s cubic-bezier(.18,.75,.2,1)}.turn-back .sheet{animation:turnBack .55s ease}.cover{flex-direction:column}.coverFrame{width:min(88vw,455px);height:calc(100dvh - 155px);max-height:750px;display:flex;align-items:center;justify-content:center}.cover img{max-width:100%;max-height:100%;object-fit:contain;box-shadow:0 22px 70px #000}.eyebrow{font:11px Georgia,serif;letter-spacing:.18em;color:var(--gold);margin-bottom:14px}.intro h1,.toc h1{font-size:36px;font-weight:500;margin:0 0 24px}.introText{font-size:18px;line-height:2.05;color:#f1eaf3}.toc{position:relative;background:#251034;border:1px solid #c58af060;border-radius:24px;padding:34px 24px}.toc:after{content:"🐈‍⬛  ☆";position:absolute;right:18px;top:16px}.tocList{display:grid;grid-template-columns:1fr 1fr;gap:9px;max-height:58dvh;overflow:auto}.tocItem{display:flex;gap:8px;align-items:center;text-align:left;border-radius:14px;padding:12px;background:#ffffff0e;border:1px solid #c89ae644;color:#fff}.tocNo{font:11px Georgia,serif;color:var(--gold)}.tocName{font-size:15px;flex:1}.letter{position:relative;background:radial-gradient(circle at 82% 12%,#6c2d8d,#3b1555 28%,#210d33 62%,#13091e);border:1px solid #c58af075;border-radius:22px;padding:42px 30px 32px;min-height:590px}.letter:after{content:"🐈‍⬛  ☆";position:absolute;right:19px;top:15px;letter-spacing:7px}.sender{margin:8px 0 28px;padding-bottom:17px;border-bottom:1px solid #d5adf34d}.senderLabel{font-size:11px;color:#d8bce8;letter-spacing:.12em}.senderName{font-size:29px;font-weight:600;overflow-wrap:anywhere}.sectionLabel{display:block;color:var(--gold);font-size:12px;font-weight:700;letter-spacing:.08em;margin-bottom:9px}.favorite{margin:0 0 27px;font-size:20px;line-height:2.05;white-space:pre-wrap;overflow-wrap:anywhere}.messageWrap{margin-top:8px}.message{font-size:20px;line-height:2.05;white-space:pre-wrap;overflow-wrap:anywhere}.long .message,.long .favorite{font-size:17px;line-height:1.9}.long-name .senderName{font-size:21px;line-height:1.45}.cursor{display:inline-block;width:1px;height:1.1em;background:#e5caff;animation:blink .7s steps(1) infinite}.nav{display:flex;gap:10px;margin-top:22px}.nav button{flex:1}.count{text-align:center;color:#aa91b5;font-size:12px;margin-top:13px}.special{text-align:center;background:#251034;border:1px solid #c38ef05c;border-radius:24px;padding:38px 24px}.envelope{width:180px;height:118px;margin:20px auto 35px;background:#54236d;border:1px solid #d4a8ee77;position:relative;animation:deliver 1.2s .2s both}.seal{position:absolute;left:50%;top:47%;transform:translate(-50%,-50%);width:42px;height:42px;border-radius:50%;background:#160a21;display:grid;place-items:center}.end{text-align:center}.big{font:38px/1.35 Georgia,serif;color:#eadcff}.names{margin-top:35px;color:#c9bdcf;line-height:2}button{appearance:none;border:1px solid #ffffff3d;background:linear-gradient(135deg,#7137a0,#9b53d1);color:#fff;border-radius:999px;padding:14px 16px;font-size:14px;font-weight:700}.open{width:min(82vw,390px);margin-top:11px}@keyframes turnIn{0%{opacity:.15;transform:rotateY(-72deg) translateX(34px);filter:brightness(.45)}70%{opacity:1}100%{transform:rotateY(0) translateX(0);filter:brightness(1)}}@keyframes turnBack{0%{opacity:.2;transform:rotateY(55deg) translateX(-24px)}100%{opacity:1;transform:rotateY(0)}}@keyframes blink{50%{opacity:0}}@keyframes deliver{from{opacity:0;transform:translateY(-45vh)}to{opacity:1;transform:none}}@media(max-width:380px){.tocList{grid-template-columns:1fr}.message,.favorite{font-size:18px}.long-name .senderName{font-size:19px}}
</style>
</head>
<body>
<section id="cover" class="page cover active"><div class="coverFrame"><img src="https://raw.githubusercontent.com/zinnbei1207/setsuna-fan-app/main/birthday-trial/cover.jpg"></div><button class="open" onclick="showPage('intro',1)">MESSAGE BOOKをひらく</button></section>
<section id="intro" class="page"><div class="sheet intro"><div class="eyebrow">FOR MIBU · 2026　☆ 🐈‍⬛</div><h1>ミブへ。</h1><div class="introText">みんなから届いた言葉を、<br>この一冊に集めました。<br><br>ページをめくるように、<br>ゆっくり読んでください。</div><div class="nav"><button onclick="showPage('cover',-1)">表紙へ</button><button onclick="showToc(1)">手紙を見る →</button></div></div></section>
<section id="toc" class="page"><div class="sheet toc"><div class="eyebrow">LETTERS FOR MIBU　☆</div><h1>届いた手紙 🐈‍⬛</h1><div id="tocList" class="tocList"></div><div class="nav"><button onclick="showPage('intro',-1)">← はじめに</button><button onclick="openLetter(0,1)">最初から読む →</button></div></div></section>
<section id="letterPage" class="page"><div id="letterSheet" class="sheet letter"><div class="eyebrow" id="letterNo"></div><div class="sender"><div class="senderLabel">FROM</div><div class="senderName" id="sender"></div></div><div class="favorite" id="favorite"><span class="sectionLabel">ミブの好きなところ</span><span id="favoriteText"></span></div><div class="messageWrap" id="messageWrap"><span class="sectionLabel">メッセージ</span><div class="message" id="message"></div></div><div class="nav"><button onclick="showToc(-1)">☰ 目次</button><button onclick="nextLetter()">次の手紙 →</button></div><div class="count" id="count"></div></div></section>
<section id="special" class="page"><div class="sheet special"><div class="eyebrow">SPECIAL LETTER　☆</div><div class="envelope"><div class="seal">🐈‍⬛</div></div><h1>うみうから、<br>特別な手紙が届いています。</h1><div class="introText">ここだけは画面ではなく、<br><strong>手元の手紙を開いて読んでね。</strong></div><div class="nav"><button onclick="showToc(-1)">☰ 目次</button><button onclick="showPage('end',1)">読み終わった →</button></div></div></section>
<section id="end" class="page"><div class="sheet end"><div class="eyebrow">HAPPY BIRTHDAY · MIBU　☆ 🐈‍⬛</div><div class="big">Thank you<br>for being MIBU.</div><div class="names">たくさんの「おめでとう」と<br>「ありがとう」を込めて。</div></div></section>
<script src="messages-part-1.js"></script>
<script src="messages-part-2.js"></script>
<script src="messages-part-3.js"></script>
<script src="messages-part-4.js"></script>
<script>
const letters=[...(window.MIBU_MESSAGES_PART_1||[]),...(window.MIBU_MESSAGES_PART_2||[]),...(window.MIBU_MESSAGES_PART_3||[]),...(window.MIBU_MESSAGES_PART_4||[])];
let current=0,timer=null,startX=0,startY=0;
function showPage(id,dir=1){clearTimeout(timer);document.querySelectorAll('.page').forEach(x=>x.classList.remove('active','turn-in','turn-back'));document.getElementById(id).classList.add('active',dir<0?'turn-back':'turn-in');scrollTo(0,0)}
function showToc(dir=1){buildToc();showPage('toc',dir)}
function buildToc(){const x=document.getElementById('tocList');x.innerHTML='';letters.forEach((l,i)=>{let b=document.createElement('button');b.className='tocItem';b.innerHTML=`<span class="tocNo">${String(i+1).padStart(2,'0')}</span><span class="tocName">${l.name}</span><span>${i%2?'🐈‍⬛':'☆'}</span>`;b.onclick=()=>openLetter(i,1);x.appendChild(b)});let b=document.createElement('button');b.className='tocItem';b.innerHTML='<span class="tocNo">☆</span><span class="tocName">うみう・特別な手紙</span><span>🐈‍⬛</span>';b.onclick=()=>showPage('special',1);x.appendChild(b)}
function openLetter(i,dir=1){current=i;let l=letters[i],sheet=document.getElementById('letterSheet');sheet.classList.toggle('long',(l.msg.length+l.fav.length)>350);sheet.classList.toggle('long-name',l.name.length>16);document.getElementById('letterNo').textContent=`LETTER ${String(i+1).padStart(2,'0')}　☆`;document.getElementById('sender').textContent=l.name;document.getElementById('favorite').style.display=l.fav?'block':'none';document.getElementById('count').textContent=`🐈‍⬛　${i+1} / ${letters.length}　☆`;showPage('letterPage',dir);typeLetter(l)}
function splitGraphemes(text){if(typeof Intl!=='undefined'&&Intl.Segmenter){return Array.from(new Intl.Segmenter('ja',{granularity:'grapheme'}).segment(text),x=>x.segment)}return Array.from(text)}
function typeInto(el,text,speed,done){el.textContent='';let parts=splitGraphemes(text),i=0,c=document.createElement('span');c.className='cursor';el.appendChild(c);function type(){if(i<parts.length){let ch=parts[i++];if(ch==='\n')c.before(document.createElement('br'));else c.before(document.createTextNode(ch));timer=setTimeout(type,speed)}else{c.remove();done&&done()}}type()}
function typeLetter(l){let fav=document.getElementById('favorite'),favText=document.getElementById('favoriteText'),wrap=document.getElementById('messageWrap'),msg=document.getElementById('message');favText.textContent='';msg.textContent='';wrap.style.display='none';function typeMsg(){wrap.style.display='block';let text=l.msg||'';typeInto(msg,text,text.length>350?18:45)}if(l.fav){fav.style.display='block';typeInto(favText,l.fav,(l.fav.length+l.msg.length)>350?18:45,()=>{timer=setTimeout(typeMsg,350)})}else{fav.style.display='none';typeMsg()}}
function nextLetter(){current<letters.length-1?openLetter(current+1,1):showPage('special',1)}
function prevLetter(){current>0?openLetter(current-1,-1):showToc(-1)}
document.addEventListener('touchstart',e=>{startX=e.changedTouches[0].screenX;startY=e.changedTouches[0].screenY},{passive:true});
document.addEventListener('touchend',e=>{const dx=e.changedTouches[0].screenX-startX,dy=e.changedTouches[0].screenY-startY;if(Math.abs(dx)<=65||Math.abs(dx)<=Math.abs(dy)*1.3)return;const active=document.querySelector('.page.active')?.id;if(dx<0){if(active==='cover')showPage('intro',1);else if(active==='intro')showToc(1);else if(active==='toc')openLetter(0,1);else if(active==='letterPage')nextLetter();else if(active==='special')showPage('end',1)}else{if(active==='intro')showPage('cover',-1);else if(active==='toc')showPage('intro',-1);else if(active==='letterPage')prevLetter();else if(active==='special')openLetter(letters.length-1,-1);else if(active==='end')showPage('special',-1)}},{passive:true});
buildToc();
</script>
</body>
</html>
