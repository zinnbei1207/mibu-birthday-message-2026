name: Add Rika message card page

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-rika-page.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply minimal Rika page changes
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')

          old_css = ".end{text-align:center}.big{font:38px/1.35 Georgia,serif;color:#eadcff}.names{margin-top:35px;color:#c9bdcf;line-height:2}button{appearance:none;"
          new_css = ".end{text-align:center}.big{font:38px/1.35 Georgia,serif;color:#eadcff}.names{margin-top:35px;color:#c9bdcf;line-height:2}.rikaPage{padding:12px}.rikaSheet{width:min(100%,1100px);display:flex;flex-direction:column;align-items:center}.rikaImage{display:block;max-width:100%;width:auto;max-height:calc(100dvh - 105px);object-fit:contain}.rikaNav{width:min(100%,520px);margin-top:10px}button{appearance:none;"
          if old_css not in text:
              raise SystemExit('CSS anchor not found')
          text = text.replace(old_css, new_css, 1)

          old_media = "@media(max-width:380px){.tocList{grid-template-columns:1fr}.message,.favorite{font-size:18px}.long-name .senderName{font-size:19px}}"
          new_media = "@media(max-width:380px){.tocList{grid-template-columns:1fr}.message,.favorite{font-size:18px}.long-name .senderName{font-size:19px}}@media(orientation:landscape){.rikaPage{padding:6px 10px}.rikaSheet{width:98vw}.rikaImage{max-width:calc(100vw - 20px);max-height:calc(100dvh - 64px)}.rikaNav{margin-top:6px}}"
          if old_media not in text:
              raise SystemExit('media anchor not found')
          text = text.replace(old_media, new_media, 1)

          old_section = '<section id="special" class="page"><div class="sheet special">'
          new_section = '<section id="rikaPage" class="page rikaPage"><div class="sheet rikaSheet"><img class="rikaImage" src="rika-message.jpg" alt="りかさんのメッセージカード" loading="lazy"><div class="nav rikaNav"><button onclick="showToc(-1)">☰ 目次</button><button onclick="openLetter(rikaAfter,1)">次の手紙 →</button></div></div></section>\n<section id="special" class="page"><div class="sheet special">'
          if old_section not in text:
              raise SystemExit('section anchor not found')
          text = text.replace(old_section, new_section, 1)

          old_const = 'const specialAfter=71;\nlet current=0,timer=null,startX=0,startY=0;'
          new_const = 'const specialAfter=71;\nconst rikaAfter=publicationOrder.indexOf("ネビル🥸")+1;\nlet current=0,timer=null,startX=0,startY=0;'
          if old_const not in text:
              raise SystemExit('const anchor not found')
          text = text.replace(old_const, new_const, 1)

          old_toc = "function specialTocButton(){let b=document.createElement('button');b.className='tocItem';b.innerHTML='<span class=\"tocNo\">☆</span><span class=\"tocName\">うみう・特別な手紙</span><span>🐈‍⬛</span>';b.onclick=()=>showPage('special',1);return b}\nfunction buildToc(){const x=document.getElementById('tocList');x.innerHTML='';letters.forEach((l,i)=>{if(i===specialAfter)x.appendChild(specialTocButton());let b=document.createElement('button');"
          new_toc = "function specialTocButton(){let b=document.createElement('button');b.className='tocItem';b.innerHTML='<span class=\"tocNo\">☆</span><span class=\"tocName\">うみう・特別な手紙</span><span>🐈‍⬛</span>';b.onclick=()=>showPage('special',1);return b}\nfunction rikaTocButton(){let b=document.createElement('button');b.className='tocItem';b.innerHTML='<span class=\"tocNo\">☆</span><span class=\"tocName\">りかさん</span><span>💌</span>';b.onclick=()=>showPage('rikaPage',1);return b}\nfunction buildToc(){const x=document.getElementById('tocList');x.innerHTML='';letters.forEach((l,i)=>{if(i===rikaAfter)x.appendChild(rikaTocButton());if(i===specialAfter)x.appendChild(specialTocButton());let b=document.createElement('button');"
          if old_toc not in text:
              raise SystemExit('toc anchor not found')
          text = text.replace(old_toc, new_toc, 1)

          old_nav = "function nextLetter(){if(current===specialAfter-1)showPage('special',1);else if(current<letters.length-1)openLetter(current+1,1);else showPage('end',1)}\nfunction prevLetter(){if(current===specialAfter)showPage('special',-1);else if(current>0)openLetter(current-1,-1);else showToc(-1)}"
          new_nav = "function nextLetter(){if(current===rikaAfter-1)showPage('rikaPage',1);else if(current===specialAfter-1)showPage('special',1);else if(current<letters.length-1)openLetter(current+1,1);else showPage('end',1)}\nfunction prevLetter(){if(current===rikaAfter)showPage('rikaPage',-1);else if(current===specialAfter)showPage('special',-1);else if(current>0)openLetter(current-1,-1);else showToc(-1)}"
          if old_nav not in text:
              raise SystemExit('nav anchor not found')
          text = text.replace(old_nav, new_nav, 1)

          old_touch_forward = "else if(active==='letterPage')nextLetter();else if(active==='special')openLetter(specialAfter,1)"
          new_touch_forward = "else if(active==='letterPage')nextLetter();else if(active==='rikaPage')openLetter(rikaAfter,1);else if(active==='special')openLetter(specialAfter,1)"
          if old_touch_forward not in text:
              raise SystemExit('forward touch anchor not found')
          text = text.replace(old_touch_forward, new_touch_forward, 1)

          old_touch_back = "else if(active==='letterPage')prevLetter();else if(active==='special')openLetter(specialAfter-1,-1);else if(active==='end')openLetter(letters.length-1,-1)"
          new_touch_back = "else if(active==='letterPage')prevLetter();else if(active==='rikaPage')openLetter(rikaAfter-1,-1);else if(active==='special')openLetter(specialAfter-1,-1);else if(active==='end')openLetter(letters.length-1,-1)"
          if old_touch_back not in text:
              raise SystemExit('back touch anchor not found')
          text = text.replace(old_touch_back, new_touch_back, 1)

          index.write_text(text, encoding='utf-8')

          sw = Path('sw.js')
          sw_text = sw.read_text(encoding='utf-8')
          if "const CACHE_NAME = 'mibu-birthday-message-2026-offline-v5';" not in sw_text:
              raise SystemExit('cache version anchor not found')
          sw_text = sw_text.replace("const CACHE_NAME = 'mibu-birthday-message-2026-offline-v5';", "const CACHE_NAME = 'mibu-birthday-message-2026-offline-v6';", 1)
          cache_anchor = "  './cover.webp',\n"
          if cache_anchor not in sw_text:
              raise SystemExit('cache asset anchor not found')
          sw_text = sw_text.replace(cache_anchor, cache_anchor + "  './rika-message.jpg',\n", 1)
          sw.write_text(sw_text, encoding='utf-8')
          PY
      - name: Commit Rika message page
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js
          git diff --cached --quiet || git commit -m 'Add Rika message card page'
          git push
