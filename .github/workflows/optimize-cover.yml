name: Optimize cover image

on:
  push:
    branches: [main]
    paths:
      - 'cover.jpg'
      - '.github/workflows/optimize-cover.yml'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python -m pip install --quiet pillow
      - name: Create lightweight WebP cover
        run: |
          python - <<'PY'
          from PIL import Image
          im = Image.open('cover.jpg').convert('RGB')
          im.thumbnail((1024, 1536), Image.Resampling.LANCZOS)
          im.save('cover.webp', 'WEBP', quality=82, method=6)
          print('cover:', im.size)
          PY
      - name: Commit optimized cover
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cover.webp
          git diff --cached --quiet || git commit -m 'Add optimized WebP cover'
          git push
