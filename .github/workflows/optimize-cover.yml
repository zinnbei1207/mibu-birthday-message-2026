name: Finalize optimized cover loading

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/optimize-cover.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update cover reference and offline cache
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')
          old = '<img src="cover.jpg">'
          new = '<img src="cover.webp" width="1024" height="1536" fetchpriority="high">'
          if old not in text:
              raise SystemExit('Expected cover.jpg reference not found')
          index.write_text(text.replace(old, new, 1), encoding='utf-8')

          sw = Path('sw.js')
          sw_text = sw.read_text(encoding='utf-8')
          if "const CACHE_NAME = 'mibu-birthday-message-2026-offline-v4';" not in sw_text:
              raise SystemExit('Expected cache version not found')
          if "  './cover.jpg'," not in sw_text:
              raise SystemExit('Expected cover.jpg cache entry not found')
          sw_text = sw_text.replace("const CACHE_NAME = 'mibu-birthday-message-2026-offline-v4';", "const CACHE_NAME = 'mibu-birthday-message-2026-offline-v5';", 1)
          sw_text = sw_text.replace("  './cover.jpg',", "  './cover.webp',", 1)
          sw.write_text(sw_text, encoding='utf-8')
          PY
      - name: Commit final cover optimization
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js
          git diff --cached --quiet || git commit -m 'Use lightweight WebP cover'
          git push
