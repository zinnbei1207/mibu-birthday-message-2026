name: Add production story

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-story.yml'
      - '.github/scripts/add-story.py'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply production story changes
        run: python .github/scripts/add-story.py
      - name: Commit production story
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Add production story pages'
          git push
